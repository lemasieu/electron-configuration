<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu cấu hình Electron</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚛️ Tra cứu cấu hình Electron</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Nhập tên, ký hiệu hoặc số hiệu...">
            <button id="searchBtn">🔍 Tìm</button>
        </div>

        <div id="result">
            <p>Chọn một nguyên tố từ danh sách bên dưới để xem chi tiết.</p>
        </div>

        <div id="elementList">
            <!-- Danh sách nguyên tố sẽ được hiển thị ở đây -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
